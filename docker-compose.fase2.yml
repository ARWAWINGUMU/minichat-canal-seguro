version: '3.8'

services:
  backend:
    build: backend
    container_name: minichat-backend-fase2
    ports:
      - "8080:8080"
      - "8081:8081" # Puerto de rechazo HTTP (solo demostrativo)
    environment:
      - PORT=8080
      - FRONTEND_ORIGIN=https://localhost:3000
      - USE_TLS=true
    volumes:
      - ./certs:/certs:ro # Monta los certificados en solo lectura
    networks:
      - red-segura

  frontend:
    build: frontend
    container_name: minichat-frontend-fase2
    ports:
      - "3000:3000" # Exponemos directo el puerto 3000 seguro
    environment:
      - PORT=3000
      - USE_TLS=true
    volumes:
      - ./certs:/certs:ro
    networks:
      - red-segura
    depends_on:
      - backend

networks:
  red-segura:
    driver: bridge
